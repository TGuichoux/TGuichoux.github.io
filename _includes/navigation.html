<nav class="site-nav" aria-label="Main navigation">
  <ul>
    {% for link in site.data.navigation.main %}
      {% assign active = false %}
      {% if page.url == link.url %}{% assign active = true %}{% endif %}
      {% if link.url != '/' and page.url contains link.url %}{% assign active = true %}{% endif %}
      <li><a href="{{ link.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ link.title | escape }}</a></li>
    {% endfor %}
  </ul>
</nav>
