<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.layout == 'home' %}{% include home-title.html %}{% else %}{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.math %}
    <script defer src="{{ '/assets/js/math.js' | relative_url }}"></script>
    <script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  {% include header.html %}
  <div class="site-shell">
    {% include author-profile.html %}
    <main id="main-content" tabindex="-1">
      {% include breadcrumbs.html %}
      {{ content }}
    </main>
  </div>
  {% include footer.html %}
  <!-- Local interactions do not wait for MathJax or external video hosts. -->
  <script src="{{ '/assets/js/carousel.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
